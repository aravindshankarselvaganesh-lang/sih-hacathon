name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Compile-check backend (py_compile)
        run: |
          python -m py_compile backend/app/main.py

      - name: Run pytest
        run: |
          python -m pytest backend -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build sulfisafe (if package.json exists)
        run: |
          if [ -f sulfisafe/package.json ]; then
            cd sulfisafe
            npm ci
            npm run build
          else
            echo "sulfisafe/package.json not found, skipping frontend build."
          fi

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Flutter analyze (guarded — runs only if flutter is installed)
        run: |
          if command -v flutter >/dev/null 2>&1; then
            flutter --version
            if [ -f mobile_app/pubspec.yaml ]; then
              cd mobile_app
              flutter pub get
              flutter analyze
            else
              echo "mobile_app/pubspec.yaml not found, skipping flutter analyze."
            fi
          else
            echo "flutter not installed on runner, skipping flutter analyze."
          fi
